<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bi-temporal intersection mark">
  <defs>
    <clipPath id="left"><circle cx="11.5" cy="16" r="7"/></clipPath>
    <style>
      .o{fill:none;stroke:#0f0f0f;stroke-width:1.8}
      .f{fill:#0f0f0f}
      @media (prefers-color-scheme:dark){.o{stroke:#f2f2f2}.f{fill:#f2f2f2}}
    </style>
  </defs>
  <!-- admission CTP (T1) and follow-up DWI (T2); the filled lens is the bi-temporal ROI -->
  <circle class="f" cx="20.5" cy="16" r="7" clip-path="url(#left)"/>
  <circle class="o" cx="11.5" cy="16" r="7"/>
  <circle class="o" cx="20.5" cy="16" r="7"/>
</svg>
